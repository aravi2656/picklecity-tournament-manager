name: Firestore rules tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install emulator test dependencies
        run: npm install --no-save firebase-tools @firebase/rules-unit-testing
      - name: Run Firestore emulator authorization tests
        run: npx firebase emulators:exec --only firestore --project demo-picklecity "node tests/firestore.rules.test.mjs"
